# Runs ON the target host (this task list is included under the play's
# normal become/connection settings, no delegate_to here) - "microk8s
# kubectl" needs to run where MicroK8s' own client certs/API live.
- name: Get raw kubeconfig from microk8s
  ansible.builtin.command: microk8s kubectl config view --raw
  register: raw_kubeconfig

# From here on, delegate_to: localhost + become: false - these tasks write
# files on the CONTROL NODE (the machine running ansible-playbook), not on
# the MicroK8s host. "become: false" matters even if the play itself runs
# with become: true, otherwise Ansible would try to write into e.g. /root
# instead of the invoking user's own $HOME.
#
# ansible.builtin.copy (next task) does not create its destination
# directory - on a control node that has never run kubectl before,
# ~/.kube may simply not exist yet, and the copy fails outright.
- name: Ensure ~/.kube exists on the control node
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ lookup('env','HOME') }}/.kube"
    state: directory
    mode: '0700'

- name: Save raw kubeconfig to local file
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ raw_kubeconfig.stdout }}"
    dest: "{{ lookup('env','HOME') }}/.kube/kubeconfig_{{ inventory_hostname }}"
    mode: '0600'

# Swap MicroK8s' baked-in loopback address for the address computed above,
# so the file written above actually works from the control node (or
# wherever else it gets copied/used) instead of only from the cluster host
# itself. Only the API server address changes - certs/keys/CA data in the
# file are untouched.
- name: Change IP in kubeconfig
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ lookup('env','HOME') }}/.kube/kubeconfig_{{ inventory_hostname }}"
    regexp: 'server: https://127.0.0.1:16443'
    replace: "server: https://{{ microk8s_api_ip }}:16443"

  # Disabled: would merge this host's kubeconfig into the shared
  # ~/.kube/config instead of leaving it as a standalone
  # kubeconfig_<inventory_hostname> file. Left disabled deliberately, not
  # just unfinished: MicroK8s names the cluster/user/context entries in its
  # raw kubeconfig identically on every host ("microk8s-cluster"/"admin"/
  # "microk8s"), so merging two hosts' kubeconfigs as-is makes the second
  # one silently overwrite the first's entries under the same names. Fixing
  # that requires renaming those entries to something unique per host
