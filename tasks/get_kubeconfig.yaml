# Fetches this host's MicroK8s kubeconfig and makes it usable from the
# control node. See doc/setup.md for how this task list is invoked
# (usecase: install vs usecase: get_kubeconfig) and doc/parameters.md for
# the full variable reference.

# MicroK8s' own kubeconfig always points kubectl at "127.0.0.1:16443" -
# correct from inside the cluster host itself, useless anywhere else. This
# fact computes the address the control node (or anyone else using the
# saved file) can actually reach.
#
# microk8s_api_host wins if set - needed because ansible_host is not
# necessarily the right address to hand to kubectl: some inventories pick
# ansible_host dynamically based on what Ansible itself needs for
# SSH/provisioning (e.g. a "web"/direct address, reachable even before a
# VPN tunnel to the host exists), which can differ from the address other
# clients (kubectl, behind a firewall rule scoped to a VPN subnet) are
# actually meant to use. Falls back to ansible_host, then inventory_hostname,
# preserving the original behavior when microk8s_api_host isn't set.
- name: Ensure we have host IP for replacement
  ansible.builtin.set_fact:
    microk8s_api_ip: "{{ microk8s_api_host | default('') | trim
                          or hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"

