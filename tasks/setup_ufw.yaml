---
# Set explicitly rather than relying on whatever UFW's own factory default
# happens to be - this role is the one enabling UFW below, so it should be
# the one deciding the baseline policy too, not an implicit assumption.
- name: Set default incoming policy
  become: true
  ufw:
    direction: incoming
    default: "{{ ufw.default_incoming }}"
  when: ufw.default_incoming is defined

# Rate-limited (ufw "limit"), not just allowed - blocks an IP that hits this
# port too many times in a row, so it's the one port that must be reachable
# for the "Enable UFW" task below to not lock out SSH access, but still
# gets brute-force protection rather than being wide open.
- name: Rate-limit SSH through UFW
  become: true
  ufw:
    rule: limit
    port: "{{ ufw.ssh_port }}"
    proto: tcp
  when: ufw.ssh_port is defined

- name: Allow MicroK8s kubectl port through UFW
  become: true
  ufw:
    rule: allow
    port: "{{ ufw.kubectl_port }}"
    proto: tcp
    from_ip: "{{ (ufw.kubectl_allow_from | default('')) or 'any' }}"
  when: ufw.kubectl_port is defined

- name: Allow ingress ports through UFW 
  become: true
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw.ingress_port | default([]) }}"

- name: Allow traffic on cni0 
  become: true
  ufw:
    rule: allow
    interface: cni0
    direction: in

- name: Allow routed traffic
  become: true
  ufw:
    rule: allow
    route: yes

- name: Set default forward policy to allow
  become: true
  ufw:
    direction: routed
    policy: allow

- name: Enable UFW
  become: true
  ufw:
    state: enabled
  notify: reload ufw