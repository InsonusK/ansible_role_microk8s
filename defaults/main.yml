---
usecase: "install"    # avalible usecases
# - install - default installation
# - get_kubeconfig - only get kubeconfig

microk8s_plugins:
  enabled: true         #feature toggle
  dns: true             # CoreDNS
  ingress: true         # Ingress controller for external access
  dashboard: true       # The Kubernetes dashboard

ufw:                    #Setup UFW when installed
  enabled: true         #feature toggle
  kubectl_port: 16443   #kubectl port
  ingress_port:         #ingress ports
    - 443

route_service:          #routing 10.152.183.0/24 (MicroK8s Service CIDR) via a dedicated dummy interface -
                        #bug fix when k8s inner traffic goes into VPN (VPN routing/reconnects can drop or
                        #shadow this route; a self-created dummy interface anchors it independently of any
                        #real NIC, so no host-specific interface name is needed)
  enabled: true         #feature toggle
  interface: microk8s-svc0  #name of the dummy interface this role creates (not an existing NIC)

get_kubeconfig:
  enabled: true         #feature toggle